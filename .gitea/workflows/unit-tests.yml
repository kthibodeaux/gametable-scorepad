name: Unit Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install g++
        run: apt-get update && apt-get install -y g++

      - name: Run unit tests
        run: ./test/run_tests.sh
